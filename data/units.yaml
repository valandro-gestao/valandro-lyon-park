# Cadastro de unidades Lyon Park
# tipo_calculo:
#   PERCENTUAL_SIMPLES    — % x max(fat - PE, 0)
#   COM_ALIQUOTA          — subtotal = fat*(1-aliq); aluguel = % x max(subtotal - PE, 0)
#   COM_ALIQUOTA_CUMUL    — COM_ALIQUOTA + custos fixos + prejuízo acumulado
#   COM_FAIXAS            — resultado em faixas progressivas (Fiergs, NL 2800, Monza, Ekos, OKA)
#   COM_ALIQUOTA_SPLIT    — COM_ALIQUOTA com rateio por splits (Axis)
#   RESULTADO_SPLIT       — receita - despesas → split operador/contratante - parcela fixa (Medcenter, Viva Open Mall)
#   PATIO_OPERACAO        — operação completa do Pátio
#   PATIO_MANUTENCAO      — manutenções do Pátio

